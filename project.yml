name: Ascend
options:
  bundleIdPrefix: com.duarte
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  Ascend:
    type: application
    platform: macOS
    sources:
      - path: Sources/Ascend
    info:
      path: Sources/Ascend/Resources/Info.plist
      properties:
        CFBundleName: Ascend
        CFBundleDisplayName: Ascend
        CFBundleIdentifier: com.duarte.ascend
        CFBundleShortVersionString: "1.0"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duarte.ascend
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_APP_SANDBOX: "NO"
  AscendTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AscendTests
    dependencies:
      - target: Ascend
schemes:
  Ascend:
    build:
      targets:
        Ascend: all
        AscendTests: [test]
    test:
      targets:
        - AscendTests
